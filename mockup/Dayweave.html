function taskRow(t){const a=area(t.area),b=blocked(t)&&t.status!=='done';let meta=[];if(a)meta.push(areaPill(t.area));if(t.time)meta.push(`<span>${icon('clock')}${esc(t.time)}</span>`);if(t.repeat)meta.push(`<span>${icon('repeat')}${esc(t.repeat==='daily'?'Daily':t.repeat==='weekdays'?'Weekdays':'Weekly')}</span>`);if(t.due)meta.push(`<span>${t.due<today?'Overdue':t.due===today?'Due today':`Due ${fmt(t.due)}`}</span>`);if(b)meta=[`<span>${icon('lock')}Waiting for ${esc(task(t.depends)?.title||'a prerequisite')}</span>`];return `<div class="task-row ${t.status==='done'?'completed':''}"><button class="task-check ${b?'blocked':t.status==='done'?'done':t.status==='in_progress'?'progress':''}" data-toggle="${esc(t.id)}" aria-label="${esc(t.status==='done'?`Reopen ${t.title}`:b?`View dependency for ${t.title}`:`Complete ${t.title}`)}"><span class="check-circle">${b?icon('lock'):t.status==='done'?'✓':''}</span></button><button class="task-open" data-task="${esc(t.id)}"><span class="task-title">${esc(t.title)}</span><span class="task-meta">${meta.join('')}</span></button>${t.status==='in_progress'&&!b?'<span class="task-status">In progress</span>':''}</div>`;}
function taskList(ts,empty='A little breathing room. Nothing here yet.'){return ts.length?`<div class="task-list">${ts.map(taskRow).join('')}</div>`:`<div class="empty"><p>${esc(empty)}</p><button class="text-button" data-action="add">+ Add a task</button></div>`;}
function goalCard(g,rail=false){let n=Math.min(100,Math.round(g.current/g.target*100));return `<div class="rail-card goal-card"><div class="label-row"><h3>${rail?'A little closer':esc(area(g.area)?.name||'Personal goal')}</h3>${icon('target')}</div><span class="goal-emoji">${esc(g.emoji)}</span><h3>${esc(g.title)}</h3><p>${esc(g.description)}</p><div class="progress-track" role="progressbar" aria-label="${esc(g.title)}" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${n}%"></div></div><div class="progress-label"><span>${g.current} of ${g.target} ${esc(g.unit)}</span><span>${n}%</span></div><button class="text-button" data-goal="${esc(g.id)}">+ Log a little progress</button></div>`;}
function railCard(id){if(id==='goal')return data.prefs.goals&&data.goals.length?goalCard(data.goals[0],true):'';if(id==='note'){const n=data.notes[0];return data.prefs.note&&n?`<div class="rail-card note-peek"><button data-note="${esc(n.id)}"><div class="eyebrow">A NOTE TO SELF</div><h3>${esc(n.title)}</h3><p>${esc(n.body.slice(0,160))}</p><span class="text-button">Keep writing ↗</span></button></div>`:'';}const e=data.events.filter(e=>e.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];return e?`<div class="rail-card"><div class="label-row"><h3>On the horizon</h3>${icon('calendar')}</div><button class="tiny-event" data-event="${esc(e.id)}"><span class="event-date">${e.date===today?'Today':e.date===plusDays(today,1)?'Tomorrow':fmt(e.date)}</span><span class="event-info"><h3>${esc(e.title)}</h3><p>${esc(e.time)} · ${esc(area(e.area)?.name||'Your calendar')}</p></span></button><button class="text-button" data-view="calendar" style="margin-top:13px">See your calendar →</button></div>`:'';}
function inboxView(){return `${heading('A place for everything.','Capture it now. Find a moment for it later.','add','Add task','INBOX')}${taskList(data.tasks.filter(t=>!t.date&&t.status!=='done'),'Your head has a little more space. Inbox is clear.')}<button class="add-inline" data-action="add">${icon('plus')} What’s on your mind?</button>`;}
function areasView(){return `${heading('The different parts of you.','A little space for every part of life.','new-area','New area','LIFE AREAS')}<div class="card-grid">${data.areas.map(a=>{let ts=data.tasks.filter(t=>t.area===a.id&&t.status!=='done');return `<button class="area-card" data-area="${esc(a.id)}"><span class="area-icon">${esc(a.emoji)}</span><h2>${esc(a.name)}</h2><p>${esc(a.description)}</p><span class="task-meta" style="margin-top:20px"><i class="area-dot" style="background:${color(a.color)}"></i>${ts.length} open ${ts.length===1?'task':'tasks'}</span></button>`;}).join('')}<button class="area-card" data-action="new-area" style="border-style:dashed;justify-content:center;align-items:center;color:var(--muted)">${icon('plus')}<h3 style="margin-top:15px">Make a space of your own</h3></button></div>`;}
function noteCard(n){return `<button class="note-card" data-note="${esc(n.id)}"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="eyebrow">${esc(area(n.area)?.name||'Personal notes')} · ${fmt(n.updated)}</div></button>`;}
function libraryView(){return `${heading('Keep what matters close.','Ideas to return to. Things to look forward to.',libraryTab==='notes'?'new-note':'new-goal',libraryTab==='notes'?'New note':'New goal','YOUR LIBRARY')}<div class="tabs" aria-label="Library sections"><button class="${libraryTab==='notes'?'active':''}" data-library="notes" aria-pressed="${libraryTab==='notes'}">Notes <span class="small-count">${data.notes.length}</span></button><button class="${libraryTab==='goals'?'active':''}" data-library="goals" aria-pressed="${libraryTab==='goals'}">Goals <span class="small-count">${data.goals.length}</span></button></div>${libraryTab==='notes'?`<div class="notes-grid">${data.notes.map(noteCard).join('')}</div>`:`<div class="goal-grid">${data.goals.map(g=>goalCard(g)).join('')}</div>`}`;}
function calendarView(){const first=new Date(month.getFullYear(),month.getMonth(),1,12);first.setDate(first.getDate()-((first.getDay()+6)%7));const days=Array.from({length:42},(_,i)=>plusDays(dateKey(first),i));const ts=data.tasks.filter(t=>t.date===selectedDate||t.due===selectedDate),es=data.events.filter(e=>e.date===selectedDate);return `${heading('A little perspective.','Make space for your plans, and leave some room between them.','new-event','Add event','CALENDAR')}<div class="calendar-layout"><div class="calendar-box"><div class="calendar-toolbar"><h2>${month.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><div class="buttons"><button class="text-button" data-action="calendar-today">Today</button><button class="icon-button" data-month="-1" aria-label="Previous month">${icon('left')}</button><button class="icon-button" data-month="1" aria-label="Next month">${icon('chevron')}</button></div></div><div class="month-grid">${['M','T','W','T','F','S','S'].map(s=>`<div class="weekday">${s}</div>`).join('')}${days.map(k=>{const items=[...data.events.filter(e=>e.date===k),...data.tasks.filter(t=>t.date===k||t.due===k)];return `<button class="month-day ${k===selectedDate?'selected':''} ${k===today?'today':''} ${fromKey(k).getMonth()!==month.getMonth()?'other':''}" data-day="${k}" aria-label="${esc(fmt(k,{weekday:'long',month:'long',day:'numeric'}))}, ${items.length} items" aria-pressed="${k===selectedDate}"><span class="day-number">${fromKey(k).getDate()}</span>${items.slice(0,2).map(t=>`<span class="month-entry">${esc(t.title)}</span>`).join('')}${items.length>2?`<span class="month-entry more">+${items.length-2} more</span>`:''}</button>`;}).join('')}</div></div><section class="day-agenda"><div class="section-head"><h2>${fmt(selectedDate,{month:'short',day:'numeric'})}<span style="font-size:12px;color:var(--muted);font-weight:400;margin-left:7px">${fmt(selectedDate,{weekday:'short'})}</span></h2><button class="text-button" data-action="add">+ Task</button></div>${es.map(e=>`<div class="event-row"><button data-event="${esc(e.id)}"><h3>${esc(e.title)}</h3><p>${esc(e.time)} · Event</p></button></div>`).join('')}${taskList(ts,'An open day. What would you like to make time for?')}<button class="add-inline" data-action="new-event">${icon('calendar')} Add an event</button></section></div>`;}
function modal(title,body){if(!$('#dialog').open)previousFocus=document.activeElement;$('#dialog').classList.remove('appearance-dialog');$('#dialog-content').innerHTML=`<div class="dialog-header"><h2 id="dialog-title">${esc(title)}</h2><button class="icon-button" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body">${body}</div>`;if(!$('#dialog').open)$('#dialog').showModal();$('#dialog-content form input:not([type=hidden])')?.focus();}
function closeModal(){if(prefsBefore){data.prefs=prefsBefore;prefsBefore=null;render();}$('#dialog').close();previousFocus?.focus();}
const options = (selected='',inbox='Inbox / no area')=>`<option value="">${inbox}</option>${data.areas.map(a=>`<option value="${esc(a.id)}" ${selected===a.id?'selected':''}>${esc(a.emoji)} ${esc(a.name)}</option>`).join('')}`;
function field(name,label,value='',type='text',required=false){return `<label class="field"><span class="field-label">${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='text'?'maxlength="200"':''}></label>`;}
function filesMarkup(){return stagedFiles.map((f,i)=>`<div class="attachment">${f.data?`<img src="${f.data}" alt="">`:icon('file')}<span>${esc(f.name)}<br><small>${f.data?'Image preview saved':'File details only'} · ${Math.ceil(f.size/1024)} KB</small></span><button type="button" data-remove-file="${i}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('');}
function openTask(id){const t=id?task(id):null;if(id&&!t)return;stagedFiles=structuredClone(t?.files||[]);const b=t&&blocked(t)&&t.status!=='done';const d=t?.date??(view==='inbox'?'':selectedDate);modal(t?'A little thing to do':'What’s on your mind?',`<p class="dialog-subtitle">${t?'Give it some attention, at your own pace.':'Start with a thought. The rest can come later.'}</p><form id="task-form" data-id="${esc(t?.id||'')}">${field('title','Task name',t?.title||'','text',true)}<div class="detail-state">${t?`<span class="pill ${t.status==='done'?'green':''}">${t.status==='in_progress'?'In progress':t.status==='done'?'Done':t.status==='on_hold'?'On hold':'To do'}</span>`:''}${b?'<span class="pill warm">Waiting</span>':''}${t?.repeat?`<span class="pill">${icon('repeat')}${esc(t.repeat)} routine</span>`:''}</div><div class="field-grid"><label class="field"><span class="field-label">Life area</span><select name="area">${options(t?.area||(view==='area'?selectedArea:''))}</select></label>${field('date','Plan for',d,'date')}</div>${!t?'<details class="extra-details"><summary>More details · repeat, notes, files</summary>':''}<div class="field-grid">${field('time','Time (optional)',t?.time||'','time')}${field('due','Due by (optional)',t?.due||'','date')}</div><label class="field"><span class="field-label">A little context</span><textarea name="description" maxlength="10000" placeholder="Ideas, details, or a gentle reminder…">${esc(t?.description||'')}</textarea></label>${!t?`<label class="field"><span class="field-label">Repeat</span><select name="repeat"><option value="">Just this once</option><option value="daily">Every day</option><option value="weekdays">Weekdays</option><option value="weekly">Every week</option></select></label><p class="info-text">Recurring tasks in this mockup create a four-week preview.</p>`:''}<label class="field"><span class="field-label">Ready after</span><select name="depends"><option value="">Nothing — ready whenever you are</option>${data.tasks.filter(x=>x.id!==t?.id).map(x=>`<option value="${esc(x.id)}" ${t?.depends===x.id?'selected':''}>${esc(x.title)}${x.status==='done'?' ✓':''}</option>`).join('')}</select></label>${b?`<div class="notice">First, finish “${esc(task(t.depends)?.title||'the prerequisite')}”. Completing it will make this task ready.</div>`:''}${t?.checklist?.length?`<h3 style="margin-top:20px">Little steps</h3><div class="checklist">${t.checklist.map((c,i)=>`<label class="check-label"><input type="checkbox" name="check-${i}" ${c.done?'checked':''}>${esc(c.text)}</label>`).join('')}</div>`:''}<label class="field"><span class="field-label">Add checklist steps (one per line)</span><textarea name="newSteps" rows="2" style="min-height:65px" placeholder="One small step…"></textarea></label><label class="field"><span class="field-label">Result / completion note</span><textarea name="result" style="min-height:65px" placeholder="What came out of this?">${esc(t?.result||'')}</textarea></label><div class="section-head" style="margin-top:20px"><h3>Things to keep with it</h3></div><div id="attachment-list" class="attachment-list">${filesMarkup()}</div><label class="file-label" style="margin-top:10px">${icon('clip')} Attach a file<input id="file-picker" type="file" multiple accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,.pdf,.txt,.md,.csv,.docx,.xlsx"></label><p class="info-text" style="margin-top:8px">Demo: photos up to 1 MB save a preview. Other files save their name and size only; nothing is uploaded.</p>${!t?'</details>':''}<div id="form-error" class="form-error" role="alert"></div><div class="dialog-footer">${t?`<button type="button" class="text-button danger" data-delete-task="${esc(t.id)}">Delete</button>`:''}<div class="actions"><button type="submit" class="${t?'secondary':'primary'}" name="intent" value="save">${t?'Save changes':'Add task'}</button>${t?`<button type="submit" class="primary" name="intent" value="${t.status==='done'?'reopen':t.status!=='in_progress'?'start':'complete'}" ${b?'disabled':''}>${t.status==='done'?'Reopen':t.status!=='in_progress'?(t.status==='on_hold'?'Resume task':'Start task'):'Mark done'}</button>${t.status==='todo'?`<button type="submit" class="secondary" name="intent" value="complete" ${b?'disabled':''}>Done</button>`:''}`:''}</div></div></form>`);}
function openNote(id){const n=data.notes.find(x=>x.id===id);modal(n?'A place for your thoughts':'A fresh page',`<form id="note-form" data-id="${esc(n?.id||'')}">${field('title','Title',n?.title||'','text',true)}<label class="field"><span class="field-label">Life area</span><select name="area">${options(n?.area||(view==='area'?selectedArea:''),'Personal notes')}</select></label><label class="field"><span class="field-label">Your note</span><textarea class="note-editor" name="body" rows="11" maxlength="50000" placeholder="A thought, a list, a little something worth keeping…">${esc(n?.body||'')}</textarea></label><p class="info-text">Plain-text notes for this first mockup. Save to keep your changes in this browser.</p><div class="dialog-footer">${n?`<button type="button" class="text-button danger" data-delete-note="${esc(n.id)}">Delete note</button>`:''}<div class="actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="primary">Save note</button></div></div></form>`);}
function openEvent(id){const e=data.events.find(x=>x.id===id);modal(e?'Something to look forward to':'Make some space',`<form id="event-form" data-id="${esc(e?.id||'')}">${field('title','Event name',e?.title||'','text',true)}<div class="field-grid">${field('date','Day',e?.date||selectedDate,'date',true)}${field('time','Time',e?.time||'10:00','time',true)}</div><label class="field"><span class="field-label">Life area</span><select name="area">${options(e?.area||'','No area')}</select></label><label class="field"><span class="field-label">Details</span><textarea name="description">${esc(e?.description||'')}</textarea></label><div class="dialog-footer">${e?`<button type="button" class="text-button danger" data-delete-event="${esc(e.id)}">Delete event</button>`:''}<div class="actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="primary">Save event</button></div></div></form>`);}
function openArea(id){const a=area(id);modal(a?'Make this space yours':'A space for part of your life',`<form id="area-form" data-id="${esc(a?.id||'')}">${!a?`<label class="field"><span class="field-label">Start from a template</span><select id="area-template"><option value="">Make my own</option><option value="Learning">📖 Learning</option><option value="Travel">🧳 Travel</option><option value="Chores">🧺 Chores</option><option value="Creative life">🪴 Creative life</option></select></label>`:''}${field('name','Name',a?.name||'','text',true)}<div class="field-grid"><label class="field"><span class="field-label">Icon</span><select name="emoji">${['🏡','💻','🌿','🎨','📖','🧳','🧺','🪴','✨','🎵','🐾','☕'].map(e=>`<option ${e===a?.emoji?'selected':''}>${e}</option>`).join('')}</select></label>${field('color','Color',a?.color||'#9b89b6','color')}</div>${field('description','A few words about this space',a?.description||'')}<div class="dialog-footer"><div class="actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="primary">${a?'Save changes':'Create life area'}</button></div></div></form>`);}
function openGoal(id){const g=data.goals.find(x=>x.id===id);modal(g?'A little closer':'Something to grow toward',g?`<div class="dialog-subtitle">${esc(g.emoji)} ${esc(g.title)}</div><p style="font:calc(30px * var(--text-scale)) var(--app-font);margin:15px 0">${g.current} <span style="font-size:17px;color:var(--muted)">of ${g.target} ${esc(g.unit)}</span></p><form id="progress-form" data-id="${esc(g.id)}"><label class="field"><span class="field-label">Add progress (${esc(g.unit)})</span><input name="amount" type="number" min="0.1" step="0.1" value="1" required></label>${field('note','A little note (optional)','','text')}<div class="dialog-footer"><button type="button" class="text-button" data-action="edit-goal" data-id="${esc(g.id)}">Edit goal</button><button class="primary">Log progress</button></div></form>${g.entries?.length?`<section class="settings-section"><h3>Your recent steps</h3>${g.entries.slice().reverse().map(e=>`<div class="setting-row"><span>+${e.amount} ${esc(g.unit)} · ${fmt(e.date)}<br><span class="info-text">${esc(e.note)}</span></span><button class="text-button" data-remove-entry="${esc(e.id)}" data-goal-id="${esc(g.id)}">Undo</button></div>`).join('')}</section>`:''}`:goalForm());}
function goalForm(g){return `<form id="goal-form" data-id="${esc(g?.id||'')}">${field('title','What would you like to work toward?',g?.title||'','text',true)}<div class="field-grid">${field('target','Target',g?.target||12,'number',true)}${field('unit','Unit (books, walks, hours…)',g?.unit||'books','text',true)}</div><label class="field"><span class="field-label">Life area</span><select name="area">${options(g?.area||'','Personal goal')}</select></label>${field('description','A gentle intention',g?.description||'')}${field('emoji','Emoji',g?.emoji||'✨')}<p class="info-text">This mockup demonstrates numeric goals. Linked-task and checklist goals are in the build specification.</p><div id="form-error" class="form-error" role="alert"></div><div class="dialog-footer"><div class="actions"><button type="button" class="secondary" data-action="close">Cancel</button><button class="primary">Save goal</button></div></div></form>`;}
function openSearch(){modal('Find a little something',`<p class="dialog-subtitle">Search your tasks, notes, life areas, and goals.</p><input class="input search-input" id="search-input" type="search" placeholder="What are you looking for?" aria-label="Search everything" autocomplete="off"><div id="search-results"><p class="info-text">Try “bookshelf”, “reading”, or the name of a life area.</p></div>`);setTimeout(()=>$('#search-input')?.focus(),20);}
function search(q){q=q.toLowerCase().trim();if(!q){$('#search-results').innerHTML='<p class="info-text">Type a few words to find something.</p>';return;}const matches=[...data.tasks.filter(t=>(t.title+' '+t.description).toLowerCase().includes(q)).map(t=>`<button class="nav-item" data-task="${esc(t.id)}">${icon('check')}<span>${esc(t.title)}<small style="display:block">Task · ${esc(area(t.area)?.name||'Inbox')}</small></span></button>`),...data.notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q)).map(n=>`<button class="nav-item" data-note="${esc(n.id)}">${icon('book')}<span>${esc(n.title)}<small style="display:block">Note</small></span></button>`),...data.areas.filter(a=>a.name.toLowerCase().includes(q)).map(a=>`<button class="nav-item" data-area="${esc(a.id)}">${esc(a.emoji)} ${esc(a.name)}</button>`),...data.goals.filter(g=>g.title.toLowerCase().includes(q)).map(g=>`<button class="nav-item" data-goal="${esc(g.id)}">${icon('target')}${esc(g.title)}</button>`)];$('#search-results').innerHTML=matches.slice(0,25).join('')||'<div class="empty">Nothing here yet. Try another word.</div>';}
function openAbout(){modal('A first little look.',`<p class="dialog-subtitle">Dayweave · interactive mockup 0.5</p><p class="info-text">Try creating tasks, changing dates, finishing a prerequisite, writing notes, logging goal progress, and making the colors your own. Your demo changes stay in this browser when storage is available.</p><div class="notice">This is a design sandbox with sample data, not the secure production app. There are no accounts, cloud sync, real notifications, or file uploads. Please use sample content.</div><p class="info-text">Recurring tasks create a four-week preview. Small photos can be stored locally; other attachments retain metadata only. Notes use plain text. These are deliberate mockup shortcuts, not changes to the product specification.</p><div class="dialog-footer"><button class="text-button danger" data-action="reset-demo">Reset sample data</button><button class="primary" data-action="close">Let’s explore</button></div>`);}
function navigate(v){view=v;mobileLane='todo';if(v==='today')selectedDate=today;areaFilter='all';if($('#dialog').open)closeModal();render();window.scrollTo({top:0,behavior:'instant'});}
function saveAndClose(message){persist();closeModal();render();toast(message);}
function validateDependency(id,dep){const visited=new Set([id]);let current=dep;while(current){if(visited.has(current))return false;visited.add(current);current=task(current)?.depends;}return true;}
function submitTask(form,intent){const f=new FormData(form),id=form.dataset.id||uid(),existing=task(id),dep=String(f.get('depends')||''),title=String(f.get('title')).trim(),date=String(f.get('date')||''),time=String(f.get('time')||''),repeat=String(f.get('repeat')||existing?.repeat||'');const err=$('#form-error');if(!title){err.textContent='Give this task a name.';return;}if(!validateDependency(id,dep)){err.textContent='These tasks would wait on each other. Choose a different prerequisite.';return;}if(time&&!date){err.textContent='Choose a plan date to go with this time.';return;}if(repeat&&!date&&!existing){err.textContent='Choose the first day for this routine.';return;}if(repeat==='weekdays'&&!existing&&[0,6].includes(fromKey(date).getDay())){err.textContent='Choose a weekday for the first occurrence.';return;}let status=existing?.status||'todo';if(intent==='complete')status='done';if(intent==='start')status='in_progress';if(intent==='reopen')status='todo';if((intent==='start'||intent==='complete')&&dep&&task(dep)?.status!=='done'){err.textContent='Finish the prerequisite before starting or completing this task.';return;}const checklist=(existing?.checklist||[]).map((c,i)=>({...c,done:f.has(`check-${i}`)}));String(f.get('newSteps')||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(text=>checklist.push({text,done:false}));const next={...existing,id,title,area:String(f.get('area')||''),date,due:String(f.get('due')||''),time,description:String(f.get('description')||''),result:String(f.get('result')||''),depends:dep,status,repeat,checklist,files:stagedFiles};if(existing)Object.assign(existing,next);else{data.tasks.push(next);if(repeat){const series=uid();next.series=series;for(let i=1;i<28;i++){const k=plusDays(date,i),day=fromKey(k).getDay();if(repeat==='daily'||(repeat==='weekly'&&i%7===0)||(repeat==='weekdays'&&day>0&&day<6)){data.tasks.push({...structuredClone(next),id:uid(),date:k,due:'',depends:'',status:'todo',files:[],checklist:checklist.map(c=>({...c  const prev=t.status,orders=data.tasks.map(t=>[t.id,t.boardOrder]);

}
document.addEventListener('pointerdown',e=>{const card=e.target.closest('[data-card]');if(!card||e.button!==0)return;const grip=e.target.closest('[data-drag]');if(!grip&&e.target.closest('button,a,input'))return;dragging={id:card.dataset.card,card,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,pointerId:e.pointerId,active:false};if(grip){e.preventDefault();grip.setPointerCapture(e.pointerId);}});
document.addEventListener('pointermove',e=>{const d=dragging;if(!d||d.pointerId!==e.pointerId)return;d.x=e.clientX;d.y=e.clientY;if(!d.active&&Math.hypot(d.x-d.startX,d.y-d.startY)>7){d.active=true;const r=d.card.getBoundingClientRect();d.clone=d.card.cloneNode(true);d.clone.classList.add('drag-preview');d.clone.setAttribute('aria-hidden','true');d.clone.style.width=`${Math.min(r.width,310)}px`;document.body.append(d.clone);d.card.classList.add('drag-source');document.body.classList.add('board-dragging');dragFrame=requestAnimationFrame(dragHit);}if(d.active){e.preventDefault();d.clone.style.left=`${d.x-Math.min(75,d.clone.offsetWidth/2)}px`;d.clone.style.top=`${d.y-28}px`;}} ,{passive:false});
function endDrag(e,cancel=false){const d=dragging;if(!d||d.pointerId!==e.pointerId)return;dragging=null;cancelAnimationFrame(dragFrame);d.clone?.remove();d.card.classList.remove('drag-source');document.body.classList.remove('board-dragging');document.querySelectorAll('.flow-lane').forEach(l=>l.classList.remove('drop-target','drop-blocked'));document.querySelectorAll('.flow-card').forEach(c=>c.classList.remove('insert-before'));if(d.active){suppressClickUntil=Date.now()+400;if(!cancel&&d.lane)moveTask(d.id,d.lane,d.before);else toast('Move cancelled. Your task stayed where it was.');}}
document.addEventListener('pointerup',e=>endDrag(e));document.addEventListener('pointercancel',e=>endDrag(e,true));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dragging)endDrag({pointerId:dragging.pointerId},true);});
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil&&e.target.closest('[data-card]')){e.preventDefault();e.stopImmediatePropagation();return;}const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.move){e.stopImmediatePropagation();openMove(d.move);}else if(d.transition){e.stopImmediatePropagation();moveTask(d.transition,d.status);}else if(d.laneTab){e.stopImmediatePropagation();mobileLane=d.laneTab;scrollToLane(d.laneTab);}},true);


render();

</script>
